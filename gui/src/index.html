<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CRDB → ZOHO CSV Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="menubar">
    <div class="menu">
      <button class="menu-title" data-menu-btn="file" aria-haspopup="menu" aria-expanded="false">File</button>
      <div class="menu-dropdown" id="menu-file">
        <button class="menu-item" data-action="pick-input">Choose input folder…<span class="shortcut">Ctrl+O</span></button>
        <button class="menu-item" data-action="pick-output">Choose output folder…<span class="shortcut">Ctrl+Shift+O</span></button>
        <button class="menu-item" data-action="rescan">Rescan<span class="shortcut">F5</span></button>
        <button class="menu-item" data-action="convert">Convert<span class="shortcut">Ctrl+Enter</span></button>
        <hr>
        <button class="menu-item" data-action="show-log">Open log folder</button>
        <hr>
        <button class="menu-item" data-action="exit">Exit</button>
      </div>
    </div>
    <div class="menu">
      <button class="menu-title" data-menu-btn="help" aria-haspopup="menu" aria-expanded="false">Help</button>
      <div class="menu-dropdown" id="menu-help">
        <button class="menu-item" data-action="help">Help<span class="shortcut">F1</span></button>
        <hr>
        <button class="menu-item" data-action="check-updates">Check for updates…</button>
        <button class="menu-item" data-action="report-issue">Report an issue…</button>
        <hr>
        <button class="menu-item" data-action="license">License</button>
        <button class="menu-item" data-action="about">About CRDB CSV Converter</button>
      </div>
    </div>
  </nav>
  <header>
    <div class="folder-row">
      <span class="folder-label">Input:</span>
      <span id="input-dir" class="folder-path">– not selected –</span>
      <button id="pick-input">Change…</button>
    </div>
    <div class="folder-row">
      <span class="folder-label">Output:</span>
      <span id="output-dir" class="folder-path">– not selected –</span>
      <button id="pick-output">Change…</button>
    </div>
  </header>

  <main>
    <table id="file-table">
      <thead>
        <tr><th>File</th><th>Size</th><th>Status</th></tr>
      </thead>
      <tbody id="file-rows" aria-live="polite"></tbody>
    </table>
    <p id="empty-hint" style="display:none">No XLS files — choose an input folder or drag files here.</p>
  </main>

  <footer>
    <label><input type="checkbox" id="force"> Force re-conversion</label>
    <div class="spacer"></div>
    <button id="open-output">Open output folder</button>
    <button id="convert" class="primary">Convert</button>
  </footer>

  <div id="modal-overlay" style="display:none">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" aria-label="Close">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="main.js" defer></script>
</body>
</html>
